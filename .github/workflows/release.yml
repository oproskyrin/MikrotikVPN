name: Build release images

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.3'
      - name: Build container archives for ARMv7 and ARM64
        run: |
          set -eux
          for spec in 'armv7 arm 7 arm32-v7a' 'arm64 arm64 - arm64-v8a'; do
            set -- $spec
            suffix="$1"; goarch="$2"; goarm="$3"; xrayarch="$4"
            rm -rf dist/panel-layer dist/xray-layer stage/panel stage/xray /tmp/xray
            mkdir -p dist/panel-layer dist/xray-layer/usr/local/bin dist/xray-layer/etc/ssl/certs stage/panel stage/xray
            if [ "$goarch" = arm ]; then export GOARM="$goarm"; else unset GOARM; fi
            (cd src && CGO_ENABLED=0 GOOS=linux GOARCH="$goarch" go build -trimpath -ldflags='-s -w' -o "../dist/panel-$suffix" .)
            install -m 755 "dist/panel-$suffix" dist/panel-layer/panel
            cp /etc/ssl/certs/ca-certificates.crt dist/xray-layer/etc/ssl/certs/
            curl -fsSL -o /tmp/xray.zip "https://github.com/XTLS/Xray-core/releases/download/v26.10.21/Xray-linux-$xrayarch.zip"
            unzip -q /tmp/xray.zip xray -d /tmp/xray
            install -m 755 /tmp/xray/xray dist/xray-layer/usr/local/bin/xray
            tar -C dist/panel-layer -cf stage/panel/layer.tar panel
            tar -C dist/xray-layer -cf stage/xray/layer.tar .
            printf '{"architecture":"%s","os":"linux","config":{"Entrypoint":["/panel"],"WorkingDir":"/"}}' "$goarch" > stage/panel/config.json
            printf '[{"Config":"config.json","RepoTags":["local/unblock-panel:%s"],"Layers":["layer.tar"]}]' "$suffix" > stage/panel/manifest.json
            printf '{"local":{"unblock-panel":{"%s":"layer"}}}' "$suffix" > stage/panel/repositories
            tar -C stage/panel -czf "dist/unblock-panel-$suffix.tar.gz" config.json manifest.json repositories layer.tar
            printf '{"architecture":"%s","os":"linux","config":{"Entrypoint":["/usr/local/bin/xray","run","-config","/etc/xray/config.json"],"WorkingDir":"/"}}' "$goarch" > stage/xray/config.json
            printf '[{"Config":"config.json","RepoTags":["local/xray-vless:%s"],"Layers":["layer.tar"]}]' "$suffix" > stage/xray/manifest.json
            printf '{"local":{"xray-vless":{"%s":"layer"}}}' "$suffix" > stage/xray/repositories
            tar -C stage/xray -czf "dist/xray-vless-$suffix.tar.gz" config.json manifest.json repositories layer.tar
          done
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/unblock-panel-armv7.tar.gz
            dist/xray-vless-armv7.tar.gz
            dist/unblock-panel-arm64.tar.gz
            dist/xray-vless-arm64.tar.gz
